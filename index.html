<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的商城 · 修复版</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<style>
img { max-width: 100%; border-radius: 10px; }
.product { border:1px solid #ddd; padding:15px; margin:10px; border-radius:10px; background:white; }
#adminPanel, #buyBox { background: white; padding:20px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.2); margin-top:20px; }
</style>
</head>
<body>

<nav class="container-fluid">
<ul><li><strong>我的商城</strong></li></ul>
<ul>
<!-- 修复1：使用javascript:void(0)防止页面刷新 -->
<li><a href=" " onclick="showAdmin()">后台</a ></li>
</ul>
</nav>

<main class="container">
<h2>商品列表</h2>
<div id="productList"></div>
</main>

<!-- 后台面板 -->
<div id="adminPanel" style="display:none" class="container">
<h3>后台管理</h3>
<input type="password" id="adminPass" placeholder="输入密码">
<button onclick="login()">登录</button>

<div id="adminContent" style="display:none">
<h4>添加商品</h4>
<input id="name" placeholder="商品名称">
<input id="price" placeholder="价格">
<input id="stock" placeholder="库存">
<input id="img" placeholder="图片链接（图床URL）">
<button onclick="addProduct()">添加商品</button>
<button onclick="clearAll()">一键清空</button>
<div id="adminList"></div>
</div>
</div>

<!-- 购买弹窗 -->
<div id="buyBox" style="display:none" class="container">
<h3>填写信息</h3>
<input id="grade" placeholder="年级">
<input id="class" placeholder="班级">
<input id="nameUser" placeholder="姓名">
<button onclick="confirmBuy()">确认信息</button>
<button onclick="closeBuy()">取消</button>
</div>

<script>
// HTML转义函数
function escapeHtml(unsafe) {
  if (!unsafe) return '';
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// 加载数据
let products = [];
try {
  const saved = localStorage.getItem("products");
  if (saved) {
    products = JSON.parse(saved);
    // 修复图片URL
    products = products.map(p => {
      try {
        if (p.img && p.img.includes('%')) {
          p.img = decodeURIComponent(p.img);
        }
      } catch (e) {}
      return p;
    });
  }
} catch (e) {
  console.error("加载失败", e);
  products = [];
}

// 保存数据
function save() {
  const toSave = products.map(p => ({
    ...p,
    img: p.img ? encodeURI(p.img) : p.img
  }));
  localStorage.setItem("products", JSON.stringify(toSave));
}

// 渲染商品列表（用户端）
function render() {
  const list = document.getElementById("productList");
  const MAX_DISPLAY = 50;
  const visibleProducts = products.filter(p => !p.hidden);
  const displayProducts = visibleProducts.slice(0, MAX_DISPLAY);

  let html = '';
  displayProducts.forEach(p => {
    const originalIndex = products.findIndex(prod => prod === p);
    html += `
      <div class="product">
        < img src="${escapeHtml(p.img || 'https://via.placeholder.com/200?text=无图片')}" onerror="this.src='https://via.placeholder.com/200?text=图片失效'">
        <h4>${escapeHtml(p.name)}</h4>
        <p>价格：${escapeHtml(p.price)}</p >
        <p>库存：${escapeHtml(p.stock)}</p >
        <button onclick="buy(${originalIndex})" ${p.stock <= 0 ? 'disabled' : ''}>${p.stock <= 0 ? '售罄' : '购买'}</button>
      </div>
    `;
  });

  if (visibleProducts.length > MAX_DISPLAY) {
    html += `<div class="product" style="text-align:center;">共 ${visibleProducts.length} 件商品，仅显示前 ${MAX_DISPLAY} 件</div>`;
  } else if (visibleProducts.length === 0) {
    html = '<div class="product" style="text-align:center;">暂无商品</div>';
  }

  list.innerHTML = html;
}

// 渲染后台列表
function renderAdmin() {
  const list = document.getElementById("adminList");
  if (products.length === 0) {
    list.innerHTML = '<div class="product">暂无商品</div>';
    return;
  }

  let html = '';
  products.forEach((p, i) => {
    html += `
      <div class="product">
        <h4>${escapeHtml(p.name)}</h4>
        <p>库存: ${escapeHtml(p.stock)} | 状态: ${p.hidden ? '已下架' : '已上架'}</p >
        <button onclick="remove(${i})">删除</button>
        <button onclick="toggle(${i})">${p.hidden ? '上架' : '下架'}</button>
      </div>
    `;
  });
  list.innerHTML = html;
}

// 添加商品
function addProduct() {
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  let stock = document.getElementById("stock").value.trim();
  let img = document.getElementById("img").value.trim();

  if (!name || !price) return alert("商品名称和价格不能为空");

  // 处理图片URL
  if (img) {
    try { decodeURIComponent(img); } catch (e) { img = encodeURI(img); }
  } else {
    img = 'https://via.placeholder.com/200?text=无图片';
  }

  products.push({
    name,
    price,
    stock: parseInt(stock) || 0,
    img,
    hidden: false
  });

  save();
  render();
  renderAdmin();

  // 清空输入
  document.getElementById("name").value = '';
  document.getElementById("price").value = '';
  document.getElementById("stock").value = '';
  document.getElementById("img").value = '';
}

// 删除商品
function remove(i) {
  if (confirm("确定删除？")) {
    products.splice(i, 1);
    save();
    render();
    renderAdmin();
  }
}

// 上下架
function toggle(i) {
  products[i].hidden = !products[i].hidden;
  save();
  render();
  renderAdmin();
}

// 清空所有
function clearAll() {
  if (confirm("确定清空所有商品？")) {
    products = [];
    save();
    render();
    renderAdmin();
  }
}

// 登录后台
function login() {
  const pass = document.getElementById("adminPass").value;
  if (pass === "suis2026") {
    document.getElementById("adminContent").style.display = "block";
    renderAdmin();
  } else {
    alert("密码错误");
  }
}

// 修复2：显示后台，并阻止任何默认行为
function showAdmin() {
  const panel = document.getElementById("adminPanel");
  panel.style.display = "block";
  // 确保面板不会被其他代码隐藏
  return false;
}

// 购买
let current = null;

function buy(i) {
  if (products[i].stock <= 0) {
    alert("库存不足");
    return;
  }
  current = i;
  document.getElementById("buyBox").style.display = "block";
}

// 确认购买
function confirmBuy() {
  const g = document.getElementById("grade").value.trim();
  const c = document.getElementById("class").value.trim();
  const n = document.getElementById("nameUser").value.trim();

  if (!g || !c || !n) return alert("请填写完整信息");

  alert("请扫码付款（二维码区域）");

  products[current].stock--;
  save();
  render();

  alert("购买成功！");
  closeBuy();
}

// 关闭购买弹窗
function closeBuy() {
  document.getElementById("buyBox").style.display = "none";
  document.getElementById("grade").value = '';
  document.getElementById("class").value = '';
  document.getElementById("nameUser").value = '';
}

// 初始化
render();
</script>

</body>
</html>
